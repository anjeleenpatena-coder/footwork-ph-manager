<style>
:root{
  --bg:#F7F5F9; --surface:#FFFFFF; --ink:#16101C; --muted:#655C70; --line:#E3DDE8;
  --pink:#E8157F; --pink-ink:#FFFFFF; --lime:#8ACB17; --lime-ink:#16101C; --good:#11834F; --bad:#C62D3F; --soft:#F1ECF4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0B13; --surface:#1B1521; --ink:#F6F1F8; --muted:#AFA5B8; --line:#322839;
    --pink:#FF3C9D; --pink-ink:#140F18; --lime:#9BE22D; --lime-ink:#140F18; --good:#46D38F; --bad:#FF6B7C; --soft:#261E2D;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0B13; --surface:#1B1521; --ink:#F6F1F8; --muted:#AFA5B8; --line:#322839;
  --pink:#FF3C9D; --pink-ink:#140F18; --lime:#9BE22D; --lime-ink:#140F18; --good:#46D38F; --bad:#FF6B7C; --soft:#261E2D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:22px;font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
a{color:var(--pink)}
.wrap{max-width:880px;margin:0 auto;padding:12px 16px 110px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 14px}
header.top .brand{display:flex;align-items:center;gap:10px}
header.top img{width:48px;height:48px;border-radius:50%}
header.top p{margin:0;color:var(--muted);font-size:13px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.banner{display:block;width:100%;max-width:100%;height:auto;border-radius:14px;margin-bottom:14px;aspect-ratio:1200/446;object-fit:cover}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{display:flex;max-width:880px;width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 64px;background:none;border:0;padding:9px 2px 11px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--pink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:var(--pink);color:var(--pink-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:3px;text-align:left}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:500}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.money{font-variant-numeric:tabular-nums}
.split{margin:6px 0 4px}
.split .bar{display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--soft)}
.split .bar div{display:flex;align-items:center;padding:0 10px;font-weight:800;font-size:13px;white-space:nowrap;min-width:0}
.split .inst{background:var(--lime);color:var(--lime-ink)}
.split .biz{background:var(--pink);color:var(--pink-ink);flex:1}
.split .legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.ledger{width:100%;border-collapse:collapse;font-size:15px}
.ledger td{padding:7px 0;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ledger tr.sum td{font-weight:800;border-bottom:0}
.ledger tr.sub td{color:var(--muted);font-size:13px;padding-top:0}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:12px 0}
.list li:first-child{border-top:0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--lime) 30%,transparent);color:var(--ink)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.pink{background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pinputs input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.att{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.att input[type=number]{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.inl{width:70px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:700}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:0;background:none;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.toggle button[aria-pressed="true"].g{background:var(--good);color:#fff}
.toggle button[aria-pressed="true"].b{background:var(--bad);color:#fff}
.toggle button[aria-pressed="true"].y{background:var(--lime);color:var(--lime-ink)}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer}
dialog{border:0;border-radius:16px;padding:0;width:min(620px,94vw);max-height:88vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(15,8,20,.55)}
dialog .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2}
dialog .db{padding:16px 18px;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
dialog .df:empty{display:none}
.tablewrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:700}
table.t .r{text-align:right}
.alert{border-left:4px solid var(--lime);padding:8px 12px;background:var(--bg);border-radius:6px;margin-bottom:8px;font-size:14px}
.promo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:14px;background:color-mix(in srgb,var(--lime) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--lime) 55%,transparent)}
.promo.off{background:var(--surface);border-color:var(--line)}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .15s}
.switch input:checked+span{background:var(--pink)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid var(--lime);outline-offset:2px}
.ratetbl input{width:100%;min-width:80px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.bell{position:relative;flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer}
.bell svg{width:20px;height:20px}
@media (max-width:440px){.sync{white-space:normal;max-width:78px;text-align:right;line-height:1.25}}
.bell.on{border-color:var(--pink);color:var(--pink)}
.bell .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--pink);color:var(--pink-ink);font-size:11px;font-weight:800;line-height:18px;text-align:center;display:none}
.cbox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.totbox{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.totbox div{display:flex;justify-content:space-between;gap:10px}
.totbox div span:last-child{white-space:nowrap;font-weight:700}
.totbox .big{font-size:17px;font-weight:800;margin-top:4px}
@media (prefers-reduced-motion:reduce){.toast,.switch span,.switch span::after{transition:none}}
</style>
</head>

const DOC_PATH = "studio/main";
const LS_KEY = "footworkph-crm-v3";
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const DEFAULT_TYPES = [{id:"ct_zumba",name:"Zumba"},{id:"ct_hiphop",name:"Hip Hop"},{id:"ct_aero",name:"Aero Step Dance"}];

const DEFAULT = {
  settings:{
    studioName:"Footwork PH", instructorPct:40, minPerClass:0, capacity:10, merchDiscPct:10, remindDays:3,
    rates:{ nonMember:{reg:0,promo:""}, member:{reg:0,promo:""}, membershipFee:{reg:0,promo:""} },
    rental:{ hour:400, extHour:300 },
    promo:{active:false, ends:""},
    classTypes: DEFAULT_TYPES,
    plans:[], instructors:[],
    categories:["Rent","Equipment","Utilities","Marketing","Supplies","Merchandise","Other"]
  },
  members:[], sessions:[], expenses:[], rentals:[], items:[], sales:[]
};
const LISTS = ["members","sessions","expenses","rentals","items","sales"];
let S = structuredClone(DEFAULT);
let tab = "dash", peopleSeg = "member", peopleQ = "", classTypeFilter = "";
let docRef = null, saveTimer = null, pendingSave = false, readOnly = false;

/* ---------- member numbers ---------- */
const MEMBER_MONTHS = 4;
const noNum = v => { const m=String(v||"").match(/(\d+)\s*$/); return m?+m[1]:0; };
const nextMemberNo = list => "FW-"+String((list||S.members).reduce((a,m)=>Math.max(a,noNum(m.memberNo)),0)+1).padStart(3,"0");

/* ---------- storage ---------- */
function normalize(d){
  d = d || {};
  const o = {};
  LISTS.forEach(k=>{ o[k] = Array.isArray(d[k]) ? d[k] : []; });
  const ds = d.settings || {};
  const st = Object.assign(structuredClone(DEFAULT.settings), ds);
  st.rates = Object.assign(structuredClone(DEFAULT.settings.rates), ds.rates||{});
  if(ds.dropInRate!=null && !ds.rates) st.rates.nonMember.reg = +ds.dropInRate||0;
  delete st.dropInRate;
  st.rental = Object.assign({hour:400, extHour:300}, ds.rental||{});
  st.promo = Object.assign({active:false,ends:""}, ds.promo||{});
  if(!Array.isArray(ds.classTypes)) st.classTypes = structuredClone(DEFAULT_TYPES);
  if(!st.categories.includes("Merchandise")) st.categories.splice(Math.max(0,st.categories.length-1),0,"Merchandise");
  st.plans = (st.plans||[]).map(p=>Object.assign({promoPrice:""},p));
  st.instructors = (st.instructors||[]).map(i=>Object.assign({pct:"",min:"",contact:"",notes:"",types:[]},i));
  o.settings = st;
  o.members = o.members.map(m=>Object.assign({type:"member"},m));
  o.members.forEach(m=>{ if(m.type==="member" && !m.memberNo) m.memberNo = nextMemberNo(o.members); });
  o.sessions = o.sessions.map(s=>Object.assign({instStatus:"present",paidOut:false,pctOverride:"",attendees:[],typeId:""},s));
  return o;
}
function setSync(t){ document.getElementById("sync").textContent = t; }
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(!docRef || readOnly){ setSync(docRef ? "View only" : "Saved on this device"); return; }
  pendingSave = true; setSync("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await docRef.set(JSON.parse(JSON.stringify(S))); pendingSave=false; setSync("Saved"); }
    catch(err){
      pendingSave=false;
      if(err && err.code==="invalid_argument"){ readOnly=true; setSync("View only"); }
      else if(err && err.code==="unavailable"){ setTimeout(save, 1500+Math.random()*1000); }
      else setSync("Not saved. Check your connection.");
    }
  }, 600);
}
async function init(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = normalize(JSON.parse(raw)); }catch(e){}
  render();
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db = null; }
  if(!db){ setSync("Saved on this device"); return; }
  docRef = db.doc(DOC_PATH);
  try{
    const snap = await docRef.get();
    if(snap.exists){ S = normalize(snap.data()); render(); }
    setSync("Synced");
  }catch(e){ setSync("Offline. Saved on this device."); }
  docRef.onSnapshot(snap=>{
    if(pendingSave || !snap.exists) return;
    S = normalize(snap.data()); if(!dlg.open) render(); setSync("Synced");
  }, ()=>{});
}

/* ---------- helpers ---------- */
const peso = n => "₱" + (Math.round((+n||0)*100)/100).toLocaleString("en-PH",{maximumFractionDigits:2});
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => iso ? new Date(iso+"T00:00").toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"}) : "";
const fmtTime = t => { if(!t) return ""; const [h,m]=t.split(":").map(Number); return ((h%12)||12)+":"+String(m).padStart(2,"0")+(h>=12?" PM":" AM"); };
const addDays = (iso,n)=>{ const d=new Date(iso+"T00:00"); d.setDate(d.getDate()+(+n||0)); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addHours = (t,h)=>{ if(!t) return ""; const [a,b]=t.split(":").map(Number); const m=(a*60+b+Math.round((+h||0)*60))%(1440); return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
const isSet = v => v!=="" && v!=null;
const plan = id => S.settings.plans.find(p=>p.id===id);
const instr = id => S.settings.instructors.find(i=>i.id===id);
const member = id => S.members.find(m=>m.id===id);
const ctype = id => S.settings.classTypes.find(t=>t.id===id);
const item = id => S.items.find(x=>x.id===id);
const saleGross = x => (+x.qty||0)*(+x.price||0);
const saleTotal = x => Math.max(0, saleGross(x)-(+x.discount||0));
const addMonths = (iso,n)=>{ if(!iso) return ""; const [y,mo,d]=iso.split("-").map(Number); const t=new Date(y,mo-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0"); };
const cardExpired = m => !!m.validUntil && m.validUntil < todayISO();
const memLabel = m => (m.memberNo ? m.memberNo+" — " : "")+m.name;
const fmtSize = b => b>=1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";

/* ---------- renewal reminders (bell) ---------- */
const remindDays = () => { const n=+S.settings.remindDays; return isFinite(n) && n>=0 ? n : 3; };
const daysLeft = iso => Math.round((new Date(iso+"T00:00") - new Date(todayISO()+"T00:00"))/86400000);
const remindDate = m => m.validUntil ? addDays(m.validUntil, -remindDays()) : "";
const whenTxt = d => d===0 ? "today" : d===1 ? "tomorrow" : "in "+d+" days";
const cardMembers = () => S.members.filter(m=>m.type==="member" && m.validUntil).map(m=>({m,d:daysLeft(m.validUntil)}));
const dueReminders = () => cardMembers().filter(x=>x.d>=0 && x.d<=remindDays()).sort((a,b)=>a.d-b.d);
function updateBell(){
  const n = dueReminders().filter(x=>x.m.remindedFor!==x.m.validUntil).length;
  const b=document.getElementById("bell"), c=document.getElementById("bellN"); if(!b) return;
  b.classList.toggle("on", n>0); c.textContent=n; c.style.display = n ? "block" : "none";
  b.setAttribute("aria-label", n ? `Renewal reminders, ${n} to send` : "Renewal reminders");
}
function bellDlg(){
  const due=dueReminders(), nd=remindDays();
  const next=cardMembers().filter(x=>x.d>nd).sort((a,b)=>a.d-b.d).slice(0,5);
  const row=({m,d})=>{ const done=m.remindedFor===m.validUntil;
    return `<li><div class="row between"><div style="min-width:0"><b>${esc(m.name)}</b>${m.memberNo?` <span class="pill pink">${esc(m.memberNo)}</span>`:""}
      <div class="small">Expires <b>${fmtDate(m.validUntil)}</b> · ${whenTxt(d)}</div>
      <div class="small muted" style="overflow-wrap:anywhere">${esc([m.contact,m.email].filter(Boolean).join(" · ")||"No contact saved")}</div></div>
      <span class="pill ${done?"ok":"warn"}">${done?"Reminded":"To remind"}</span></div>
      <button type="button" class="btn sm ${done?"ghost":""}" style="margin-top:8px" data-rem="${m.id}">${done?"Undo":"Mark as reminded"}</button></li>`; };
  openDlg("Renewal reminders", `
    <p class="small muted" style="margin-top:0">Shows members ${nd} day${nd===1?"":"s"} before their membership expires.</p>
    ${due.length?`<ul class="list">${due.map(row).join("")}</ul>`:`<p class="empty">No reminders today.</p>`}
    ${next.length?`<h3 style="margin:16px 0 6px">Coming up</h3><ul class="list">${next.map(({m})=>`<li><div class="row between"><div style="min-width:0"><b>${esc(m.name)}</b>${m.memberNo?` <span class="pill pink">${esc(m.memberNo)}</span>`:""}<div class="small muted">Expires ${fmtDate(m.validUntil)}</div></div><span class="small" style="white-space:nowrap">Remind <b>${fmtDate(remindDate(m))}</b></span></div></li>`).join("")}</ul>`:""}`,
    {noFoot:true});
  document.getElementById("dlgBody").onclick=e=>{ const b=e.target.closest("[data-rem]"); if(!b) return; const m=member(b.dataset.rem); if(!m) return;
    m.remindedFor = m.remindedFor===m.validUntil ? "" : m.validUntil; save(); updateBell(); bellDlg(); };
}

/* ---------- contract files (kept on this device) ---------- */
const FILE_DB="footworkph-files", FILE_STORE="contracts";
function fileDb(){ return new Promise((res,rej)=>{ let rq; try{ rq=indexedDB.open(FILE_DB,1); }catch(e){ rej(e); return; }
  rq.onupgradeneeded=()=>rq.result.createObjectStore(FILE_STORE); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function fileOp(mode, fn){ const db=await fileDb(); return new Promise((res,rej)=>{ const tx=db.transaction(FILE_STORE,mode); const rq=fn(tx.objectStore(FILE_STORE));
  tx.oncomplete=()=>{ db.close(); res(rq.result); }; tx.onerror=tx.onabort=()=>{ db.close(); rej(tx.error); }; }); }
const fileSave = (id,f) => fileOp("readwrite", s=>s.put(f,id));
const fileGet = id => fileOp("readonly", s=>s.get(id)).catch(()=>null);
const fileDel = id => fileOp("readwrite", s=>s.delete(id)).catch(()=>{});
function openFile(f){ const url=URL.createObjectURL(f); const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; dlg.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); }
const typeName = s => ctype(s.typeId)?.name || s.title || "Class";
const promoOn = () => { const p=S.settings.promo; return !!p.active && (!p.ends || todayISO()<=p.ends); };
const rate = key => { const r=S.settings.rates[key]||{}; return promoOn() && isSet(r.promo) ? +r.promo : (+r.reg||0); };
const planPrice = p => promoOn() && isSet(p.promoPrice) ? +p.promoPrice : (+p.price||0);
const inR = (d,r) => d && d>=r.from && d<=r.to;
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }

/* ---------- period filter (shared) ---------- */
const P = { mode:"month", day:todayISO(), month:todayISO().slice(0,7), year:todayISO().slice(0,4), from:addDays(todayISO(),-6), to:todayISO() };
const mondayOf = iso => { const d=new Date(iso+"T00:00"); return addDays(iso,-((d.getDay()+6)%7)); };
const lastDayOf = ym => { const [y,m]=ym.split("-").map(Number); return ym+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0"); };
const shortD = iso => new Date(iso+"T00:00").toLocaleDateString("en-PH",{month:"short",day:"numeric"});
const monthName = ym => new Date(ym+"-01T00:00").toLocaleDateString("en-PH",{month:"long",year:"numeric"});
const daysBetween = (f,t) => Math.round((new Date(t+"T00:00")-new Date(f+"T00:00"))/864e5)+1;
function periodRange(){
  if(P.mode==="day") return {from:P.day, to:P.day, label:new Date(P.day+"T00:00").toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric",year:"numeric"})};
  if(P.mode==="week"){ const f=mondayOf(P.day), t=addDays(f,6); return {from:f, to:t, label:`${shortD(f)} – ${shortD(t)}, ${t.slice(0,4)}`}; }
  if(P.mode==="year") return {from:P.year+"-01-01", to:P.year+"-12-31", label:"Year "+P.year};
  if(P.mode==="range"){ let f=P.from||todayISO(), t=P.to||f; if(t<f){ const x=f; f=t; t=x; } return {from:f, to:t, label:`${shortD(f)} – ${shortD(t)}, ${t.slice(0,4)}`}; }
  return {from:P.month+"-01", to:lastDayOf(P.month), label:monthName(P.month)};
}
function periodNav(dir){
  if(P.mode==="day") P.day=addDays(P.day,dir);
  else if(P.mode==="week") P.day=addDays(P.day,7*dir);
  else if(P.mode==="year") P.year=String(+P.year+dir);
  else if(P.mode==="month"){ const [y,m]=P.month.split("-").map(Number); const d=new Date(y,m-1+dir,1); P.month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  else { const r=periodRange(), n=daysBetween(r.from,r.to); P.from=addDays(r.from,n*dir); P.to=addDays(r.to,n*dir); }
}
function periodBar(){
  const r=periodRange(), m=P.mode;
  const inp = (m==="day"||m==="week") ? `<input type="date" data-pin="day" value="${P.day}" aria-label="${m==="week"?"Any day in the week":"Day"}">`
    : m==="month" ? `<input type="month" data-pin="month" value="${P.month}" aria-label="Month">`
    : m==="year" ? `<input type="number" min="2020" max="2100" data-pin="year" value="${P.year}" aria-label="Year" style="width:110px">`
    : `<input type="date" data-pin="from" value="${P.from}" aria-label="From"><span class="muted small">to</span><input type="date" data-pin="to" value="${P.to}" aria-label="To">`;
  return `<div class="card" style="padding:12px">
    <div class="seg" role="group" aria-label="Filter by" style="margin-bottom:10px">${[["day","Day"],["week","Week"],["month","Month"],["year","Year"],["range","Dates"]].map(([k,l])=>`<button type="button" data-pmode="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div>
    <div class="row between">
      <button type="button" class="btn sm ghost" data-pnav="-1" aria-label="Previous">‹</button>
      <b style="text-align:center;flex:1">${r.label}</b>
      <button type="button" class="btn sm ghost" data-pnav="1" aria-label="Next">›</button>
    </div>
    <div class="row pinputs" style="margin-top:10px;justify-content:center">${inp}</div>
  </div>`;
}
function periodEvent(el, type){
  if(type==="click"){
    if(el.dataset.pmode){ const nm=el.dataset.pmode;
      if(nm==="month") P.month=P.day.slice(0,7);
      if(nm==="year") P.year=P.day.slice(0,4);
      P.mode=nm; return true; }
    if(el.dataset.pnav){ periodNav(+el.dataset.pnav); return true; }
  } else if(type==="change" && el.dataset.pin){
    const k=el.dataset.pin; if(!el.value) return false;
    P[k]=el.value; if(k==="month") P.day=el.value+"-01"; if(k==="year") P.day=el.value+"-01-01"; return true;
  }
  return false;
}

/* ---------- calculations ---------- */
function instRate(s){
  const ins = instr(s.instructorId);
  const pct = isSet(s.pctOverride) ? +s.pctOverride : (ins && isSet(ins.pct) ? +ins.pct : +S.settings.instructorPct);
  const min = ins && isSet(ins.min) ? +ins.min : (+S.settings.minPerClass||0);
  return {pct, min};
}
function sessionCalc(s){
  const gross = (s.attendees||[]).reduce((a,x)=>a+(+x.amount||0),0);
  const {pct,min} = instRate(s);
  const byPct = gross*pct/100;
  const absent = s.instStatus==="absent";
  const inst = absent || !(s.attendees||[]).length ? 0 : Math.max(byPct, min);
  return { gross, pct, inst, biz: gross-inst, usedMin: !absent && inst>byPct && inst>0, absent };
}
const rentalAuto = r => (+r.hours||0)*(+S.settings.rental.hour||0) + (+r.extHours||0)*(+S.settings.rental.extHour||0);
const rentalAmt = r => isSet(r.amount) ? +r.amount : rentalAuto(r);
const itemStock = id => S.expenses.filter(e=>e.itemId===id).reduce((a,e)=>a+(+e.qty||0),0) - S.sales.filter(x=>x.itemId===id).reduce((a,x)=>a+(+x.qty||0),0);
function memberStats(m){
  const visits = S.sessions.filter(s=>(s.attendees||[]).some(x=>x.memberId===m.id)).sort((a,b)=>b.date.localeCompare(a.date));
  const spent = S.sessions.reduce((a,s)=>a+(s.attendees||[]).filter(x=>x.memberId===m.id).reduce((b,x)=>b+(+x.amount||0),0),0);
  const last = visits[0]?.date || "";
  if(m.type==="nonmember"){
    return { visits:visits.length, spent, last, status: visits.length>=4?"Offer membership":"Walk-in", cls: visits.length>=4?"warn":"", perSession: rate("nonMember") };
  }
  const p = plan(m.planId);
  const used = visits.length, total = p ? +p.sessions||0 : 0;
  const left = total ? total-used : null;
  const exp = p && m.startDate && +p.days ? addDays(m.startDate, +p.days) : null;
  const today = todayISO();
  let status="Active", cls="ok";
  if(exp && exp < today){ status="Expired"; cls="bad"; }
  else if(left!==null && left<=0){ status="Used up"; cls="bad"; }
  else if((exp && addDays(today,5) >= exp) || (left!==null && left<=2)){ status="Renew soon"; cls="warn"; }
  if(m.validUntil){ if(m.validUntil < today){ status="Membership expired"; cls="bad"; } else if(cls==="ok" && addDays(today,14) >= m.validUntil){ status="Renew soon"; cls="warn"; } }
  let perSession = rate("member");
  if(p && +p.sessions){ const paid = +m.paid>0 ? +m.paid : planPrice(p); perSession = paid/(+p.sessions); }
  return { p, used, left, exp, status, cls, perSession, visits:visits.length, spent, last };
}
function totals(r){
  const ses = S.sessions.filter(s=>inR(s.date,r));
  let gross=0, inst=0, biz=0, heads=0, memHeads=0, nonHeads=0, nonSales=0, memSales=0, unpaid=0; const byType={};
  ses.forEach(s=>{ const c=sessionCalc(s); gross+=c.gross; inst+=c.inst; biz+=c.biz; if(!s.paidOut) unpaid+=c.inst;
    const k=typeName(s); const o=byType[k]||(byType[k]={n:0,heads:0,gross:0,biz:0}); o.n++; o.heads+=(s.attendees||[]).length; o.gross+=c.gross; o.biz+=c.biz;
    (s.attendees||[]).forEach(a=>{ heads++; if(a.kind==="nonmember"){nonHeads++; nonSales+=+a.amount||0;} else {memHeads++; memSales+=+a.amount||0;} }); });
  const exps = S.expenses.filter(e=>inR(e.date,r));
  const exp = exps.reduce((a,e)=>a+(+e.amount||0),0);
  const expMerch = exps.filter(e=>e.itemId).reduce((a,e)=>a+(+e.amount||0),0);
  const fees = S.members.filter(m=>m.type==="member" && inR(m.feeDate,r)).reduce((a,m)=>a+(+m.feePaid||0),0);
  const packs = S.members.filter(m=>m.type==="member" && inR(m.paidDate,r)).reduce((a,m)=>a+(+m.paid||0),0);
  const rents = S.rentals.filter(x=>inR(x.date,r));
  const rental = rents.filter(x=>x.status==="paid").reduce((a,x)=>a+rentalAmt(x),0);
  const rentalPending = rents.filter(x=>x.status==="pending").reduce((a,x)=>a+rentalAmt(x),0);
  const sls = S.sales.filter(x=>inR(x.date,r));
  const merch = sls.reduce((a,x)=>a+saleTotal(x),0);
  const income = biz+fees+rental+merch;
  return { ses, gross, inst, biz, exp, expMerch, fees, packs, rental, rentalPending, merch, income, net: income-exp, heads, memHeads, nonHeads, memSales, nonSales, unpaid, byType, rentCount:rents.filter(x=>x.status!=="cancelled").length, itemsSold:sls.reduce((a,x)=>a+(+x.qty||0),0) };
}
function buckets(r){
  const span = daysBetween(r.from,r.to), out=[];
  if(span<=1) return {title:"", list:[]};
  if(span<=14){ for(let d=r.from; d<=r.to; d=addDays(d,1)) out.push({from:d,to:d,label:new Date(d+"T00:00").toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric"})}); return {title:"Daily breakdown",list:out}; }
  if(span<=62){ for(let w=mondayOf(r.from); w<=r.to; w=addDays(w,7)){ const f=w<r.from?r.from:w, t=addDays(w,6)>r.to?r.to:addDays(w,6); out.push({from:f,to:t,label:`${shortD(f)} – ${shortD(t)}`}); } return {title:"Weekly breakdown",list:out}; }
  let ym=r.from.slice(0,7);
  while(ym<=r.to.slice(0,7)){ const f=ym+"-01"<r.from?r.from:ym+"-01", t=lastDayOf(ym)>r.to?r.to:lastDayOf(ym); out.push({from:f,to:t,label:new Date(ym+"-01T00:00").toLocaleDateString("en-PH",{month:"short",year:"numeric"})});
    const [y,m]=ym.split("-").map(Number); const d=new Date(y,m,1); ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  return {title:"Monthly breakdown",list:out};
}
function splitBar(inst, biz, pct){
  const total = inst+biz;
  const w = total>0 ? Math.max(0,Math.min(100, inst/total*100)) : +pct;
  return `<div class="split"><div class="bar" role="img" aria-label="Instructor ${peso(inst)}, studio ${peso(biz)}">
    <div class="inst" style="width:${w}%">${w>=18?Math.round(w)+"%":""}</div>
    <div class="biz">${100-w>=18?Math.round(100-w)+"%":""}</div></div>
    <div class="legend"><span>Instructor ${peso(inst)}</span><span>Studio ${peso(biz)}</span></div></div>`;
}
const promoStrip = () => { const on=promoOn(); const p=S.settings.promo;
  return `<div class="promo ${on?"":"off"}"><div><b>${on?"Promo rates are ON":"Regular rates"}</b><div class="small muted">${on?(p.ends?`Until ${fmtDate(p.ends)}`:"No end date set"):(p.active&&p.ends?`Promo ended ${fmtDate(p.ends)}`:"Turn on to use promo prices")}</div></div>
  <label class="switch" aria-label="Use promo rates"><input type="checkbox" data-promo ${p.active?"checked":""}><span></span></label></div>`; };
const typeOptions = (sel, blank) => (blank?`<option value="">${blank}</option>`:"") + S.settings.classTypes.map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(t.name)}</option>`).join("");

function statusToggles(s){

    :`<p class="empty">${isMem?"No members yet. Add your first member.":"No non-members yet. Walk-ins you add in a class show up here."}</p>`}</div>`;

function instPeriod(i, r){
  const ses = S.sessions.filter(s=>s.instructorId===i.id && inR(s.date,r)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let earned=0, paid=0, pending=0, present=0, absent=0, sales=0;
  ses.forEach(s=>{ const c=sessionCalc(s); sales+=c.gross; if(c.absent) absent++; else present++; earned+=c.inst; if(s.paidOut) paid+=c.inst; else pending+=c.inst; });
  return {ses, earned, paid, pending, present, absent, sales};
}
function breakdownTable(ses, keyFn, labelFn, title){
  const g={}; ses.forEach(s=>{ const k=keyFn(s); const c=sessionCalc(s); const o=g[k]||(g[k]={n:0,sales:0,inst:0,pend:0}); o.n++; o.sales+=c.gross; o.inst+=c.inst; if(!s.paidOut) o.pend+=c.inst; });
  const keys=Object.keys(g).sort(); if(!keys.length) return "";
  const tot=keys.reduce((a,k)=>({n:a.n+g[k].n,sales:a.sales+g[k].sales,inst:a.inst+g[k].inst,pend:a.pend+g[k].pend}),{n:0,sales:0,inst:0,pend:0});
  return `<h3 style="margin:16px 0 6px">${title}</h3><div class="tablewrap"><table class="t"><thead><tr><th></th><th class="r">Classes</th><th class="r">Sales</th><th class="r">Commission</th><th class="r">Pending</th></tr></thead><tbody>
  ${keys.map(k=>`<tr><td>${labelFn(k)}</td><td class="r">${g[k].n}</td><td class="r money">${peso(g[k].sales)}</td><td class="r money"><b>${peso(g[k].inst)}</b></td><td class="r money">${g[k].pend?peso(g[k].pend):"—"}</td></tr>`).join("")}
  <tr><td><b>Total</b></td><td class="r"><b>${tot.n}</b></td><td class="r money"><b>${peso(tot.sales)}</b></td><td class="r money"><b>${peso(tot.inst)}</b></td><td class="r money"><b>${peso(tot.pend)}</b></td></tr>
  </tbody></table></div>`;
}
const teaches = i => (i.types||[]).map(id=>ctype(id)?.name).filter(Boolean);

  ${ins.length?all.map(({i,m})=>{ const pct=isSet(i.pct)?+i.pct:+S.settings.instructorPct; const min=isSet(i.min)?+i.min:+S.settings.minPerClass; const tt=teaches(i);

      ${tt.length?`<div class="row" style="gap:6px;margin-top:4px">${tt.map(n=>`<span class="pill pink">${esc(n)}</span>`).join("")}</div>`:""}
      ${i.contact?`<div class="small" style="margin-top:4px"><a href="tel:${esc(i.contact.replace(/[^0-9+]/g,""))}">${esc(i.contact)}</a></div>`:""}</div>
      ${m.pending>0?`<span class="pill warn">Pending ${peso(m.pending)}</span>`:m.ses.length?`<span class="pill ok">All paid</span>`:`<span class="pill">No classes</span>`}</div>
      <div class="kpis">
        <div class="kpi"><span>Commission</span><b class="money">${peso(m.earned)}</b></div>
        <div class="kpi"><span>Class sales</span><b class="money">${peso(m.sales)}</b></div>
        <div class="kpi"><span>Paid</span><b class="money" style="color:var(--good)">${peso(m.paid)}</b></div>
        <div class="kpi"><span>Present / absent</span><b>${m.present} / ${m.absent}</b></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn sm ghost" data-act="openInstr" data-id="${i.id}">See breakdown</button><button class="btn sm ghost" data-act="schedFor" data-id="${i.id}">Schedule a class</button></div></div>`; }).join("")
  :`<div class="card empty">No instructors yet. Add one to track commission and attendance.</div>`}`;

  :`<div class="card empty">No bookings in this period.</div>`}`;

    `<button type="button" class="btn ghost" id="dlgCancel">Cancel</button><button type="button" class="btn" id="dlgSave">${saveLabel}</button>`;

    document.getElementById("dlgCancel").onclick = ()=>dlg.close();

    if(onDelete) document.getElementById("dlgDel").onclick = ()=>{ if(confirm("Delete this? This can't be undone.")){ onDelete(); save(); dlg.close(); toast("Deleted"); } };

        m.contract = cMeta || null;
        if(cFile){ const f=cFile; if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

    <div class="row" style="margin-bottom:8px">${sel("s_addn","Add a non-member…",S.members.filter(m=>m.type==="nonmember").sort(byName).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join(""))}<button type="button" class="btn sm ghost" id="s_walk">New walk-in</button></div>

    ${used?`<p class="small muted">Used in ${used} classes. Deleting keeps those classes but removes the type label.</p>`:""}`,
  { onSave:()=>{ if(!val("t_name")){ toast("Enter a name"); return false; } t.name=val("t_name"); if(isNew) S.settings.classTypes.push(t); toast(isNew?"Class type added":"Class type saved"); },
    onDelete: isNew?null:()=>{ S.settings.classTypes=S.settings.classTypes.filter(x=>x.id!==t.id); S.settings.instructors.forEach(i=>i.types=(i.types||[]).filter(x=>x!==t.id)); S.sessions.forEach(s=>{ if(s.typeId===t.id){ s.title=t.name; s.typeId=""; } }); } });
}

function rentalDlg(x){
  const isNew=!x; x = x ? structuredClone(x) : {id:uid(), date:todayISO(), time:"09:00", renter:"", contact:"", purpose:"", hours:1, extHours:0, amount:"", status:"pending", notes:""};
  const st=S.settings.rental;
  openDlg(isNew?"Add rental booking":"Edit rental booking", `
    <label class="f">Renter name<input id="r_name" value="${esc(x.renter)}"></label>
    <div class="grid2">
      <label class="f">Contact number<input id="r_contact" value="${esc(x.contact)}" inputmode="tel"></label>
      <label class="f">Purpose<input id="r_purpose" value="${esc(x.purpose)}" placeholder="e.g. dance practice, shoot"></label>
      <label class="f">Date<input type="date" id="r_date" value="${x.date}"></label>
      <label class="f">Start time<input type="time" id="r_time" value="${x.time}"></label>
      <label class="f">Hours (${peso(st.hour)}/hr)<input type="number" min="0" step="0.5" id="r_hours" value="${x.hours}"></label>
      <label class="f">Extended hours (${peso(st.extHour)}/hr)<input type="number" min="0" step="0.5" id="r_ext" value="${x.extHours}"></label>
      <label class="f">Total (₱)<input type="number" min="0" id="r_amt" value="${x.amount}" placeholder="Auto"></label>
      <label class="f">Status<select id="r_status"><option value="pending" ${x.status==="pending"?"selected":""}>Pending</option><option value="paid" ${x.status==="paid"?"selected":""}>Paid</option><option value="cancelled" ${x.status==="cancelled"?"selected":""}>Cancelled</option></select></label>
    </div>
    <p class="small" id="r_calc"></p>
    <label class="f">Notes<textarea id="r_notes" rows="2">${esc(x.notes)}</textarea></label>`,
  { onSave:()=>{
      if(!val("r_name")){ toast("Enter the renter's name"); return false; }
      const a=val("r_amt");
      Object.assign(x,{renter:val("r_name"), contact:val("r_contact"), purpose:val("r_purpose"), date:val("r_date"), time:val("r_time"), hours:+val("r_hours")||0, extHours:+val("r_ext")||0, amount:a===""?"":+a, status:val("r_status"), notes:val("r_notes")});
      if(isNew) S.rentals.push(x); else S.rentals[S.rentals.findIndex(y=>y.id===x.id)]=x;
      toast(isNew?"Booking added":"Booking saved");
    },
    onDelete: isNew?null:()=>{ S.rentals=S.rentals.filter(y=>y.id!==x.id); } });
  const calc=()=>{ const h=+val("r_hours")||0, e=+val("r_ext")||0, t=val("r_time"); const auto=h*st.hour+e*st.extHour;
    document.getElementById("r_calc").innerHTML = `Auto total: <b>${peso(auto)}</b>${t?` · ends ${fmtTime(addHours(t,h+e))}`:""}. Type a total above to give a discount.`; };
  ["r_hours","r_ext","r_time"].forEach(id=>document.getElementById(id).oninput=calc); calc();
}

function itemDlg(x){
  const isNew=!x; x = x || {id:uid(), name:"", variant:"", price:"", cost:"", lowAt:3};
  openDlg(isNew?"Add item":"Edit item", `
    <label class="f">Item name<input id="it_name" value="${esc(x.name)}" placeholder="e.g. Footwork PH shirt"></label>
    <label class="f">Size / color / notes<input id="it_var" value="${esc(x.variant||"")}" placeholder="Optional"></label>
    <div class="grid2">
      <label class="f">Selling price (₱)<input type="number" min="0" id="it_price" value="${x.price}"></label>
      <label class="f">Your cost per piece (₱)<input type="number" min="0" id="it_cost" value="${x.cost}"></label>
      ${isNew?`<label class="f">Starting stock (pcs)<input type="number" min="0" id="it_qty" value="0"></label>`:""}
      <label class="f">Warn me when stock is at<input type="number" min="0" id="it_low" value="${x.lowAt}"></label>
    </div>
    ${isNew?`<p class="small muted">Starting stock is logged as a Merchandise expense (stock × cost).</p>`:""}`,
  { onSave:()=>{
      if(!val("it_name")){ toast("Enter an item name"); return false; }
      Object.assign(x,{name:val("it_name"), variant:val("it_var"), price:+val("it_price")||0, cost:+val("it_cost")||0, lowAt:+val("it_low")||0});
      if(isNew){ S.items.push(x); const q=+val("it_qty")||0; if(q>0) S.expenses.push({id:uid(), date:todayISO(), desc:x.name+" (stock)", category:"Merchandise", amount:q*x.cost, itemId:x.id, qty:q}); }
      toast(isNew?"Item added":"Item saved");
    },
    onDelete: isNew?null:()=>{ S.items=S.items.filter(y=>y.id!==x.id); } });
}
function sellDlg(x){
  const st=itemStock(x.id);
  const pct = Math.min(100, Math.max(0, +S.settings.merchDiscPct||0));
  const mems = S.members.filter(m=>m.type==="member").sort((a,b)=>(a.memberNo||"").localeCompare(b.memberNo||"",undefined,{numeric:true}));
  openDlg("Sell "+x.name, `
    <p class="small muted">In stock: <b>${st}</b></p>
    <div class="grid2">
      <label class="f">Quantity<input type="number" min="1" id="sl_qty" value="1"></label>
      <label class="f">Price each (₱)<input type="number" min="0" id="sl_price" value="${x.price}"></label>
      <label class="f">Date<input type="date" id="sl_date" value="${todayISO()}"></label>
      <label class="f">Member ID (${pct}% off)<select id="sl_mem"><option value="">Not a member</option>${mems.map(m=>`<option value="${m.id}" ${cardExpired(m)?"disabled":""}>${esc(memLabel(m))}${cardExpired(m)?" (expired)":""}</option>`).join("")}</select></label>
    </div>
    <label class="f" id="sl_buyerWrap">Buyer (optional)<input id="sl_buyer"></label>
    ${mems.length?"":`<p class="small muted" style="margin-top:-4px">No members yet. Add members in Students to use the discount.</p>`}
    <div class="totbox" id="sl_tot"></div>`,
  { saveLabel:"Record sale", onSave:()=>{
      const q=+val("sl_qty")||0; if(q<=0){ toast("Enter a quantity"); return false; }
      if(q>st && !confirm(`Only ${st} in stock. Record anyway?`)) return false;
      const c=calc();
      S.sales.push({id:uid(), date:val("sl_date"), itemId:x.id, qty:q, price:+val("sl_price")||0, buyer:c.m?c.m.name:val("sl_buyer"),
        memberId:c.m?c.m.id:"", memberNo:c.m?(c.m.memberNo||""):"", discPct:c.m?pct:0, discount:c.disc});
      toast(c.disc?`Sale recorded with ${pct}% member discount`:"Sale recorded");
    }});
  const calc=()=>{ const gross=(+val("sl_qty")||0)*(+val("sl_price")||0); const m=member(val("sl_mem"))||null; const disc=m?Math.round(gross*pct)/100:0; return {gross, m, disc, total:gross-disc}; };
  const tot=()=>{ const c=calc(); document.getElementById("sl_buyerWrap").style.display=c.m?"none":"";
    document.getElementById("sl_tot").innerHTML = c.m
      ? `<div><span>Subtotal</span><span>${peso(c.gross)}</span></div><div><span>Member discount (${pct}%)</span><span style="color:var(--good)">− ${peso(c.disc)}</span></div><div class="big"><span>Total to collect</span><span>${peso(c.total)}</span></div>`
      : `<div class="big" style="margin-top:0"><span>Total to collect</span><span>${peso(c.gross)}</span></div>`; };
  ["sl_qty","sl_price"].forEach(id=>document.getElementById(id).oninput=tot);
  document.getElementById("sl_mem").onchange=tot; tot();
}
function restockDlg(x){
  openDlg("Restock "+x.name, `
    <div class="grid2">
      <label class="f">Quantity added<input type="number" min="1" id="rs_qty" value="10"></label>
      <label class="f">Cost per piece (₱)<input type="number" min="0" id="rs_cost" value="${x.cost}"></label>
      <label class="f">Date<input type="date" id="rs_date" value="${todayISO()}"></label>
    </div><p class="small" id="rs_tot"></p><p class="small muted">Logged as a Merchandise expense.</p>`,
  { saveLabel:"Add stock", onSave:()=>{
      const q=+val("rs_qty")||0, c=+val("rs_cost")||0; if(q<=0){ toast("Enter a quantity"); return false; }
      S.expenses.push({id:uid(), date:val("rs_date"), desc:x.name+" (stock)", category:"Merchandise", amount:q*c, itemId:x.id, qty:q}); toast("Stock added");
    }});
  const tot=()=>document.getElementById("rs_tot").innerHTML=`Total cost: <b>${peso((+val("rs_qty")||0)*(+val("rs_cost")||0))}</b>`;
  ["rs_qty","rs_cost"].forEach(id=>document.getElementById(id).oninput=tot); tot();
}

function expenseDlg(e){
  const isNew=!e; e = e || {id:uid(), date:todayISO(), desc:"", category:S.settings.categories[0]||"Other", amount:""};
  openDlg(isNew?"Add expense":"Edit expense", `
    <label class="f">Item<input id="e_desc" value="${esc(e.desc)}" placeholder="e.g. Rent"></label>
    <div class="grid2">
      <label class="f">Amount (₱)<input type="number" min="0" id="e_amt" value="${e.amount}"></label>
      <label class="f">Date<input type="date" id="e_date" value="${e.date}"></label>
      <label class="f">Category<select id="e_cat">${S.settings.categories.map(c=>`<option ${c===e.category?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
      ${e.itemId?`<label class="f">Stock quantity<input type="number" min="0" id="e_qty" value="${e.qty}"></label>`:""}
    </div>`,
  { onSave:()=>{
      const amt=+val("e_amt"); if(!val("e_desc")||!(amt>=0)||val("e_amt")===""){ toast("Enter item and amount"); return false; }
      Object.assign(e,{desc:val("e_desc"), amount:amt, date:val("e_date"), category:val("e_cat")});
      if(e.itemId) e.qty=+val("e_qty")||0;
      if(isNew) S.expenses.push(e); toast(isNew?"Expense added":"Expense saved");
    },
    onDelete: isNew?null:()=>{ S.expenses=S.expenses.filter(x=>x.id!==e.id); } });
}

function planDlg(p){
  const isNew=!p; p = p || {id:uid(), name:"", price:"", promoPrice:"", sessions:"", days:30};
  openDlg(isNew?"Add package":"Edit package", `
    <label class="f">Package name<input id="p_name" value="${esc(p.name)}" placeholder="e.g. 8-session monthly"></label>
    <div class="grid2">
      <label class="f">Regular price (₱)<input type="number" min="0" id="p_price" value="${p.price}"></label>
      <label class="f">Promo price (₱)<input type="number" min="0" id="p_promo" value="${p.promoPrice}" placeholder="Optional"></label>
      <label class="f">Sessions included (0 = unlimited)<input type="number" min="0" id="p_ses" value="${p.sessions}"></label>
      <label class="f">Valid for (days)<input type="number" min="1" id="p_days" value="${p.days}"></label>
    </div>`,
  { onSave:()=>{
      if(!val("p_name")){ toast("Enter a package name"); return false; }
      const pr=val("p_promo");
      Object.assign(p,{name:val("p_name"), price:+val("p_price")||0, promoPrice:pr===""?"":+pr, sessions:+val("p_ses")||0, days:+val("p_days")||30});
      if(isNew) S.settings.plans.push(p);
    },
    onDelete: isNew?null:()=>{ S.settings.plans=S.settings.plans.filter(x=>x.id!==p.id); } });
}

/* ---------- events ---------- */
function handleAct(b){
  const id=b.dataset.id, a=b.dataset.act;
  const ses = () => S.sessions.find(x=>x.id===id);
  const reRender = () => { if(!dlg.open) render(); };
  if(a==="newSession") sessionDlg();
  else if(a==="editSession") sessionDlg(ses());
  else if(a==="schedFor") sessionDlg(null,{instructorId:id});
  else if(a==="setStatus"){ ses().instStatus=b.dataset.v; save(); toast(b.dataset.v==="absent"?"Marked absent":"Marked present"); reRender(); }
  else if(a==="setPaid"){ ses().paidOut=b.dataset.v==="1"; save(); toast(b.dataset.v==="1"?"Marked paid":"Marked pending"); reRender(); }
  else if(a==="newMember") personDlg(null,"member");
  else if(a==="newNon") personDlg(null,"nonmember");
  else if(a==="editPerson") personDlg(member(id));
  else if(a==="newExpense") expenseDlg();
  else if(a==="editExpense") expenseDlg(S.expenses.find(x=>x.id===id));
  else if(a==="newPlan") planDlg();
  else if(a==="editPlan") planDlg(plan(id));
  else if(a==="newInstr") instrDlg();
  else if(a==="openInstr") instrProfile(instr(id));
  else if(a==="newType") typeDlg();
  else if(a==="editType") typeDlg(ctype(id));
  else if(a==="newRental") rentalDlg();
  else if(a==="editRental") rentalDlg(S.rentals.find(x=>x.id===id));
  else if(a==="rentStatus"){ const x=S.rentals.find(y=>y.id===id); x.status=b.dataset.v; save(); toast("Marked "+b.dataset.v); reRender(); }
  else if(a==="newItem") itemDlg();
  else if(a==="editItem") itemDlg(item(id));
  else if(a==="sellItem") sellDlg(item(id));
  else if(a==="restock") restockDlg(item(id));
  else if(a==="delSale"){ if(confirm("Delete this sale?")){ S.sales=S.sales.filter(x=>x.id!==id); save(); render(); toast("Sale deleted"); } }
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
const view=document.getElementById("view");
view.addEventListener("click", e=>{
  const go=e.target.closest("[data-go]"); if(go){ tab=go.dataset.go; render(); window.scrollTo(0,0); return; }
  const pe=e.target.closest("[data-pmode],[data-pnav]"); if(pe){ if(periodEvent(pe,"click")) render(); return; }
  const sg=e.target.closest("[data-seg]"); if(sg){ peopleSeg=sg.dataset.seg; render(); return; }
  const b=e.target.closest("[data-act]"); if(b) handleAct(b);
});
view.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.pin){ if(periodEvent(t,"change")) render(); return; }
  if(t.id==="ctf"){ classTypeFilter=t.value; render(); return; }
  if(t.hasAttribute("data-promo")){ S.settings.promo.active=t.checked; save(); render(); toast(t.checked?"Promo rates ON":"Regular rates ON"); return; }
  if(t.hasAttribute("data-promoends")){ S.settings.promo.ends=t.value; save(); render(); toast("Promo end saved"); return; }
  if(t.dataset.rate){ const [k,f]=t.dataset.rate.split("."); S.settings.rates[k][f]= f==="promo"&&t.value===""?"":Math.max(0,+t.value||0); save(); render(); toast("Rate saved"); return; }
  if(t.dataset.rent){ S.settings.rental[t.dataset.rent]=Math.max(0,+t.value||0); save(); render(); toast("Rental rate saved"); return; }
  if(t.dataset.pct){ const s=S.sessions.find(x=>x.id===t.dataset.pct); s.pctOverride = t.value===""?"":Math.max(0,Math.min(100,+t.value)); save(); render(); toast("Split updated for this class"); return; }
  const k=t.dataset.set; if(!k) return;
  let v=t.value;
  if(k==="categories") v=v.split(",").map(x=>x.trim()).filter(Boolean);
  else if(k==="studioPct"){ S.settings.instructorPct=100-Math.min(100,Math.max(0,+v||0)); save(); render(); toast("Split saved"); return; }
  else if(k!=="studioName") v=Math.max(0,+v||0);
  if(k==="instructorPct"||k==="merchDiscPct") v=Math.min(100,v);
  S.settings[k]=v; save(); render(); toast("Settings saved");
});
view.addEventListener("input", e=>{
  if(e.target.id==="mq"){ peopleQ=e.target.value; const pos=e.target.selectionStart; render(); const el=document.getElementById("mq"); el.focus(); el.setSelectionRange(pos,pos); }
});

document.getElementById("bell").onclick = bellDlg;
init();
})();
</script>
</body>
</html>
